about:
  klass: aboutSplit
  reverse: true
  title: Making data and images of millions of biological specimens available on the web
  description: |
      iDigBio promotes and catalyzes digitization, mobilization, and use of biodiversity specimen data from U.S. institutions and collections through community capacity building, community networks and partnerships, digital infrastructure, and standards. We envision a world in which digitized biodiversity and extended specimen data are findable, accessible, interoperable, and reusable, providing endless possibilities for research, policy, economic decision-making, and understanding of our natural world.
  background: "{{ site.data.images.ImagingStation.src }}"
  alt: "{{ site.data.images.ImagingStation.alt }}"
  imageLicense: "{{ site.data.images.ImagingStation.caption }}"
  ratio: 70
  cta:
  - text: Upcoming Events
    href: https://ufl.zoom.us/ze/hub/iDigBio
    isPrimary: true
  - text: Event Recordings
    href: https://www.youtube.com/@iDigBio
  - text: FAQ
    href: /en/faq
  - text: iDigBio Archive
    href: https://wayback.archive-it.org/17494/idigbio.org
  - text: iDigBio History
    href: /en/about

